<style>
/* Layout: one narrow column. Home = subject sections with packet cards; quiz = question cards + sticky bottom bar; parent recap = tables. */
:root {
  --bg: #f4f2fb; --card: #ffffff; --ink: #231f3a; --muted: #5f5a7d; --line: #e2ddf2;
  --pri: #6a3fd6; --pri-soft: #ede6ff; --on-pri: #ffffff;
  --ok: #1a8a4b; --ok-soft: #e3f6ea; --bad: #c9352f; --bad-soft: #fdeceb; --warn: #8a5a00; --warn-soft: #fff3d1;
  --sky: #dfeaff; --sun: #f2a516; --shadow: 0 1px 2px rgba(35,31,58,.06);
  --display: "Baloo 2", "Trebuchet MS", system-ui, sans-serif;
  --body: "Nunito", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: ui-monospace, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13122a; --card: #1d1b38; --ink: #efedff; --muted: #aaa6cf; --line: #2f2c56;
    --pri: #a68bff; --pri-soft: #2d2659; --on-pri: #15132b;
    --ok: #4cc98a; --ok-soft: #173a29; --bad: #ff7b74; --bad-soft: #43201f; --warn: #f3c45a; --warn-soft: #3d3119;
    --sky: #1f2a4f; --sun: #f7b84a; --shadow: none; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #13122a; --card: #1d1b38; --ink: #efedff; --muted: #aaa6cf; --line: #2f2c56;
  --pri: #a68bff; --pri-soft: #2d2659; --on-pri: #15132b;
  --ok: #4cc98a; --ok-soft: #173a29; --bad: #ff7b74; --bad-soft: #43201f; --warn: #f3c45a; --warn-soft: #3d3119;
  --sky: #1f2a4f; --sun: #f7b84a; --shadow: none; color-scheme: dark;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 18px; line-height: 1.5; }
button, input { font: inherit; color: inherit; }
.wrap { max-width: 720px; margin: 0 auto; padding: 18px max(16px, env(safe-area-inset-right, 0px)) 120px max(16px, env(safe-area-inset-left, 0px)); }
h1, h2, h3 { font-family: var(--display); font-weight: 800; line-height: 1.15; margin: 0; text-wrap: balance; }
.muted { color: var(--muted); }
[hidden] { display: none !important; }

/* Header */
.head { background: var(--sky); border-radius: 24px; padding: 20px; display: grid; grid-template-columns: 1fr auto; gap: 12px; align-items: center; }
.head > div { min-width: 0; }
.eyebrow { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
.head h1 { font-size: 32px; margin: 4px 0 4px; }
.head p { margin: 0; color: var(--muted); font-size: 16px; }
.head svg { width: 76px; height: 76px; }
.status { display: inline-flex; align-items: center; gap: 6px; margin-top: 10px; font-size: 14px; font-weight: 700; color: var(--muted); background: var(--card); border-radius: 999px; padding: 4px 12px; }
.status i { width: 9px; height: 9px; border-radius: 50%; background: var(--muted); }
.status.ok i { background: var(--ok); } .status.warn i { background: var(--sun); } .status.bad i { background: var(--bad); }

/* Home */
.sec { margin-top: 26px; }
.sec > h2 { font-size: 24px; margin: 0 4px 10px; display: flex; align-items: center; gap: 10px; }
.sec > h2 .dot { width: 14px; height: 14px; border-radius: 5px; background: var(--pri); flex: 0 0 auto; }
.bab { background: var(--card); border: 1px solid var(--line); border-radius: 20px; padding: 14px; margin-bottom: 12px; box-shadow: var(--shadow); }
.bab h3 { font-size: 19px; margin: 0 2px 10px; }
.bab h3 small { display: block; font-family: var(--body); font-weight: 700; font-size: 13px; color: var(--muted); letter-spacing: .03em; text-transform: uppercase; }
.pk { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.pkb { display: grid; grid-template-columns: 48px 1fr; gap: 10px; align-items: center; text-align: left; background: var(--bg); border: 2px solid var(--line); border-radius: 16px; padding: 10px 12px; cursor: pointer; -webkit-tap-highlight-color: transparent; min-height: 68px; }
.pkb:hover, .pkb:focus-visible { border-color: var(--pri); outline: none; }
.pkb:active { transform: scale(.98); }
.pkb .n { width: 48px; height: 48px; border-radius: 14px; background: var(--pri-soft); color: var(--pri); display: grid; place-items: center; font-family: var(--display); font-weight: 800; font-size: 24px; }
.pkb b { display: block; font-family: var(--display); font-size: 18px; line-height: 1.15; }
.pkb small { display: block; font-size: 13px; font-weight: 700; color: var(--muted); }
.pkb small.got { color: var(--ok); }
.empty { background: var(--card); border: 2px dashed var(--line); border-radius: 20px; padding: 22px 18px; text-align: center; color: var(--muted); }
.empty b { display: block; color: var(--ink); font-family: var(--display); font-size: 20px; margin-bottom: 4px; }
.foot { margin-top: 30px; text-align: center; }
a { color: var(--pri); }
.linkbtn { background: none; border: 0; color: var(--pri); font-weight: 800; text-decoration: underline; cursor: pointer; padding: 8px; }

/* Quiz */
.qhero { background: var(--pri); color: var(--on-pri); border-radius: 22px; padding: 18px 18px 16px; }
.qhero .eyebrow { color: inherit; opacity: .85; }
.qhero h1 { font-size: 26px; margin: 4px 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { background: rgba(255,255,255,.2); border-radius: 999px; padding: 3px 12px; font-size: 14px; font-weight: 700; }
.back { display: inline-flex; align-items: center; gap: 6px; background: var(--card); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; font-weight: 800; cursor: pointer; margin-bottom: 12px; }
h2.part { font-size: 21px; margin: 24px 4px 2px; }
p.part { margin: 0 4px 12px; color: var(--muted); font-size: 16px; }
.q { background: var(--card); border: 2px solid var(--line); border-radius: 18px; padding: 14px; margin-bottom: 12px; }
.q.ok { border-color: var(--ok); } .q.no { border-color: var(--bad); }
.qh { display: grid; grid-template-columns: 34px 1fr; gap: 10px; }
.qn { width: 34px; height: 34px; border-radius: 50%; background: var(--pri-soft); color: var(--pri); font-weight: 800; display: grid; place-items: center; font-size: 16px; }
.qt { margin: 3px 0 10px; font-weight: 700; min-width: 0; overflow-wrap: anywhere; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { display: flex; align-items: center; gap: 12px; border: 2px solid var(--line); border-radius: 14px; padding: 10px 12px; cursor: pointer; min-height: 52px; -webkit-tap-highlight-color: transparent; position: relative; }
.opt input { position: absolute; opacity: 0; pointer-events: none; }
.let { flex: 0 0 32px; height: 32px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; font-weight: 800; font-size: 15px; color: var(--muted); }
.opt.sel { border-color: var(--pri); background: var(--pri-soft); }
.opt.sel .let { background: var(--pri); border-color: var(--pri); color: var(--on-pri); }
.opt.right { border-color: var(--ok); background: var(--ok-soft); }
.opt.right .let { background: var(--ok); border-color: var(--ok); color: var(--on-pri); }
.opt.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opt.wrong .let { background: var(--bad); border-color: var(--bad); color: var(--on-pri); }
.locked .opt { cursor: default; }
.txt { width: 100%; border: 2px solid var(--line); border-radius: 14px; padding: 12px 14px; font-size: 18px; background: var(--bg); }
.txt:focus { outline: none; border-color: var(--pri); }
.fb { margin-top: 10px; border-radius: 12px; padding: 10px 12px; font-size: 16px; }
.fb.ok { background: var(--ok-soft); } .fb.no { background: var(--bad-soft); } .fb.near { background: var(--warn-soft); }
.fb .ex { display: block; margin-top: 4px; }
.sus { display: grid; grid-template-columns: auto 1.4em; justify-content: start; margin: 10px 0 2px 4px; font-family: var(--mono); font-size: 24px; font-weight: 700; letter-spacing: .3em; line-height: 1.35; text-align: right; }
.sus .u { border-bottom: 3px solid var(--ink); }
.sus .op { text-align: left; letter-spacing: 0; }
.bar { position: fixed; left: 0; right: 0; bottom: 0; background: var(--card); border-top: 1px solid var(--line); padding: 10px max(16px, env(safe-area-inset-right, 0px)) calc(10px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px)); z-index: 5; }
.bar .in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.prog { flex: 1; min-width: 0; }
.prog small { display: block; color: var(--muted); font-size: 14px; font-weight: 700; }
.track { height: 9px; background: var(--pri-soft); border-radius: 99px; overflow: hidden; margin-top: 4px; }
.fill { height: 100%; width: 0; background: var(--pri); transition: width .25s; }
.btn { border: 0; border-radius: 14px; padding: 13px 20px; font-size: 17px; font-weight: 800; background: var(--pri); color: var(--on-pri); cursor: pointer; white-space: nowrap; }
.btn.ghost { background: var(--pri-soft); color: var(--pri); }
.result { background: var(--card); border: 2px solid var(--pri); border-radius: 22px; padding: 20px 18px; margin: 14px 0; text-align: center; }
.score { font-family: var(--display); font-size: 68px; font-weight: 800; line-height: 1; color: var(--pri); margin: 6px 0; }
.stars { font-size: 28px; letter-spacing: 4px; }
.msg { font-weight: 800; font-size: 19px; margin: 6px 0 12px; }
.grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; }
.box { background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 14px; color: var(--muted); }
.box b { display: block; font-size: 20px; color: var(--ink); }
.save { font-size: 14px; color: var(--muted); margin-top: 12px; }
.acts { display: flex; gap: 10px; justify-content: center; margin-top: 14px; flex-wrap: wrap; }
.modal { position: fixed; inset: 0; background: rgba(20,16,40,.5); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 10; }
.modal.show { display: flex; }
.dlg { background: var(--card); border-radius: 20px; padding: 20px; max-width: 380px; width: 100%; }
.dlg h3 { font-size: 21px; margin-bottom: 6px; }
.dlg p { margin: 0 0 16px; color: var(--muted); }
.dlg .acts { justify-content: flex-end; }

/* Parent recap */
.rk h1 { font-size: 28px; margin-bottom: 4px; }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 14px 16px; margin-top: 14px; box-shadow: var(--shadow); }
.card h2 { font-size: 20px; margin-bottom: 8px; }
.note { font-size: 15px; color: var(--muted); }
.tbl { width: 100%; border-collapse: collapse; font-size: 15px; }
.tbl th { text-align: left; font-size: 12px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); padding: 6px 6px; border-bottom: 1px solid var(--line); }
.tbl td { padding: 8px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl td.num, .tbl th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.tag { display: inline-block; font-size: 12px; font-weight: 800; border-radius: 999px; padding: 2px 9px; white-space: nowrap; }
.tag.ok { background: var(--ok-soft); color: var(--ok); } .tag.no { background: var(--bad-soft); color: var(--bad); } .tag.mid { background: var(--warn-soft); color: var(--warn); } .tag.gray { background: var(--bg); color: var(--muted); }
.hist { display: flex; flex-direction: column; gap: 8px; }
.hrow { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; background: var(--bg); border: 1px solid var(--line); border-radius: 14px; padding: 10px 12px; cursor: pointer; text-align: left; width: 100%; }
.hrow b { font-family: var(--display); font-size: 17px; }
.hrow small { display: block; color: var(--muted); font-size: 13px; }
.hrow .sc { font-family: var(--display); font-weight: 800; font-size: 24px; color: var(--pri); }
.det { margin-top: 8px; padding: 10px 12px; border-left: 4px solid var(--bad); background: var(--bad-soft); border-radius: 8px; font-size: 15px; }
.det.okd { border-color: var(--ok); background: var(--ok-soft); }
@media (max-width: 420px) { .head svg { width: 56px; height: 56px; } .head h1 { font-size: 27px; } .score { font-size: 56px; } }
@media (prefers-reduced-motion: reduce) { .fill { transition: none; } .pkb:active { transform: none; } }
.pinf{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}.pinf input{font:inherit;font-size:20px;padding:10px 12px;border:2px solid var(--line);border-radius:12px;width:160px;letter-spacing:4px}.linkbtn{background:none;border:0;color:var(--pri);font:inherit;text-decoration:underline;cursor:pointer;padding:0}
</style>

<div class="wrap">
  <!-- HOME -->
  <section id="vHome">
    <header class="head">
      <div>
        <div class="eyebrow">Kelas III SD/MI</div>

        <rect x="10" y="16" width="44" height="54" rx="8" fill="var(--card)" stroke="var(--line)" stroke-width="2"/>

        <path d="M20 36l5 5 9-10M20 54l5 5 9-10" fill="none" stroke="var(--ok)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>

<script>
"use strict";
/* ===== Data ===== */
var PAKETS = [];
var BYID = {};
function loadPakets() {
  return fetch("paket/daftar.json", { cache: "no-cache" }).then(function (r) { return r.json(); }).then(function (list) {
    return Promise.all(list.map(function (f) {
      return fetch("paket/" + f.file + "?v=" + encodeURIComponent(f.v || "")).then(function (r) { return r.ok ? r.json() : null; }).catch(function () { return null; });
    }));
  }).then(function (arr) {
    PAKETS = arr.filter(Boolean); BYID = {}; PAKETS.forEach(function (p) { BYID[p.id] = p; });
  }).catch(function () { PAKETS = []; });
}
var CFG = window.RL_CONFIG || {};
var DRIVE_URL = CFG.SHEET_URL || "https://drive.google.com/drive/folders/1MjvmhHNrERyZF-gNippPi6oOYxo2-w85";
var PTS_PG = 3, PTS_IS = 5;
var $ = function (id) { return document.getElementById(id); };
function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
function plain(html) { var d = document.createElement("div"); d.innerHTML = html; return (d.textContent || "").replace(/\s+/g, " ").trim(); }
function lsGet(k, d) { try { var v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch (e) { return d; } }
function lsSet(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} }
function shuffle(a) { a = a.slice(); for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; } return a; }
function device() { var u = navigator.userAgent || ""; if (/iPad/.test(u) || (/Macintosh/.test(u) && navigator.maxTouchPoints > 1)) return "iPad"; if (/iPhone/.test(u)) return "iPhone"; if (/Android/.test(u)) return "Android"; return "Lainnya"; }
function fmtDate(iso) { try { return new Date(iso).toLocaleString("id-ID", { timeZone: "Asia/Makassar", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit" }); } catch (e) { return iso; } }

/* ===== Database: Google Sheet lewat Google Apps Script ===== */
/* Hasil disimpan dulu di perangkat (rl-pending), lalu dikirim saat ada internet. Server menolak kiriman ganda (id sama). */
var db = null, dbState = "connecting", ATTEMPTS = [], attemptsLoaded = false, SUMMARY = {}, pinError = "";
function setStatus(state, text) {
  dbState = state;
  var el = $("stHome"); el.className = "status " + (state === "ok" ? "ok" : state === "connecting" ? "" : state === "pending" ? "warn" : "bad");
  el.lastElementChild.textContent = text;
}
function refreshStatus() {
  var pend = lsGet("rl-pending", []).length;
  if (!CFG.API_URL) { setStatus("off", "Nilai hanya tersimpan di perangkat ini"); return; }
  if (!db) { setStatus(dbState === "connecting" ? "connecting" : (pend ? "pending" : "off"), dbState === "connecting" ? "Menyambungkan…" : (pend ? pend + " hasil menunggu internet" : "Belum tersambung. Nilai tetap tersimpan di perangkat ini")); return; }
  if (pend) setStatus("pending", pend + " hasil menunggu disimpan");
  else setStatus("ok", "Nilai tersimpan otomatis");
}
function api(params, body) {
  var url = CFG.API_URL + "?" + Object.keys(params).map(function (k) { return encodeURIComponent(k) + "=" + encodeURIComponent(params[k]); }).join("&");
  var ctrl = window.AbortController ? new AbortController() : null;
  var tm = setTimeout(function () { if (ctrl) ctrl.abort(); }, 25000);
  var opt = { redirect: "follow", signal: ctrl ? ctrl.signal : undefined };
  if (body) { opt.method = "POST"; opt.body = JSON.stringify(body); opt.headers = { "Content-Type": "text/plain;charset=utf-8" }; }
  return fetch(url, opt).then(function (r) { return r.json(); }).then(function (j) {
    clearTimeout(tm); if (!j || !j.ok) throw (j || { error: "kosong" }); return j;
  }, function (e) { clearTimeout(tm); throw { error: "jaringan", detail: String(e) }; });
}
function connect() {
  if (!CFG.API_URL) { dbState = "off"; refreshStatus(); return; }
  api({ action: "summary", key: CFG.WRITE_KEY }).then(function (j) {
    db = true; SUMMARY = j.summary || {}; refreshStatus(); renderHome();
    return flushPending().then(function () { if (parentPin() && !$("vRekap").hidden) loadAttempts(); });
  }).catch(function () { db = null; dbState = "off"; refreshStatus(); });
}
function parentPin() { return lsGet("rl-pin", ""); }
function pinForm() {
  $("rNote").textContent = "Rekap ini untuk orang tua. Masukkan PIN orang tua.";
  $("rBody").innerHTML = '<div class="card"><form class="pinf" id="pinF"><input id="pinIn" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN orang tua">' +
    '<button class="btn" type="submit">Buka rekap</button></form>' + (pinError ? '<p class="note" style="color:var(--bad)">' + esc(pinError) + "</p>" : "") + "</div>";
  $("pinF").onsubmit = function (e) {
    e.preventDefault(); var v = $("pinIn").value.trim(); if (!v) return;
    lsSet("rl-pin", v); pinError = ""; attemptsLoaded = false; $("rNote").textContent = "Memeriksa PIN…"; $("rBody").innerHTML = "";
    if (!db) connect(); else loadAttempts();
  };
}
function bindPinOut() {
  var b = $("pinOut"); if (!b) return;
  b.onclick = function () { lsSet("rl-pin", ""); ATTEMPTS = []; attemptsLoaded = false; renderRekap(); };
}
function loadAttempts() {
  if (!db) return Promise.resolve();

  /* per mapel-bab */
  var bab = {};
  A.forEach(function (a) { var k = a.mapel + " · Bab " + a.bab; var b = bab[k] = bab[k] || { judul: a.judulBab, n: 0, sum: 0, last: 0, best: 0, firstNew: [] , seen: {} }; b.n++; b.sum += a.nilai; b.last = a.nilai; b.best = Math.max(b.best, a.nilai); if (!b.seen[a.paketId]) { b.seen[a.paketId] = 1; b.firstNew.push(a.nilai); } });
  h += '<div class="card"><h2>Ringkasan per bab</h2><div class="scroll"><table class="tbl"><thead><tr><th>Mapel / bab</th><th class="num">Dicoba</th><th class="num">Rata-rata</th><th class="num">Terakhir</th><th class="num">Percobaan pertama*</th></tr></thead><tbody>';
  Object.keys(bab).forEach(function (k) { var b = bab[k], fn = Math.round(b.firstNew.reduce(function (s, x) { return s + x; }, 0) / b.firstNew.length);
    h += "<tr><td><b>" + esc(k) + "</b><br><span class=\"note\">" + esc(b.judul) + "</span></td><td class=\"num\">" + b.n + "</td><td class=\"num\">" + Math.round(b.sum / b.n) + "</td><td class=\"num\">" + b.last + "</td><td class=\"num\">" + fn + " " + statusTag(fn) + "</td></tr>"; });
  h += '</tbody></table></div><p class="note">*Rata-rata nilai saat sebuah paket dikerjakan pertama kali. Ini ukuran pemahaman yang lebih jujur, karena nilai pengulangan paket yang sama bisa naik karena hafal soal.</p></div>';

  /* misconceptions */
  var mk = {};
  A.forEach(function (a) { (a.items || []).forEach(function (it) {
    if (it.mk) { var m = mk[it.mk] = mk[it.mk] || { desc: (a.mk && a.mk[it.mk]) || "", mapel: a.mapel, n: 0, att: {}, last: "", lastOk: null }; m.n++; m.att[a._id] = 1; m.last = a.selesai; m.lastOk = false; }
    (it.target || []).forEach(function (t) { if (t !== it.mk && mk[t] && it.benar) { mk[t].lastOk = true; } });
  }); });
  var rec = Object.keys(mk).map(function (k) { var m = mk[k]; m.code = k; m.na = Object.keys(m.att).length; return m; }).sort(function (x, y) { return y.n - x.n; });
  h += '<div class="card"><h2>Kesalahan berulang</h2>';
  if (!rec.length) h += '<p class="note">Belum ada miskonsepsi yang tercatat.</p>';
  else {
    h += '<div class="scroll"><table class="tbl"><thead><tr><th>Miskonsepsi</th><th class="num">Kali</th><th class="num">Di percobaan</th><th>Status</th></tr></thead><tbody>';
    rec.forEach(function (m) {
      var st = (m.n >= 2 && m.na >= 2) ? (m.lastOk ? '<span class="tag mid">Berulang, mulai membaik</span>' : '<span class="tag no">Berulang</span>') : (m.lastOk ? '<span class="tag ok">Sudah benar lagi</span>' : '<span class="tag gray">Baru sekali</span>');
      h += "<tr><td><b>" + esc(m.desc || m.code) + "</b><br><span class=\"note\">" + esc(m.mapel) + " · " + esc(m.code) + "</span></td><td class=\"num\">" + m.n + "</td><td class=\"num\">" + m.na + "</td><td>" + st + "</td></tr>";
    });
    h += '</tbody></table></div><p class="note">Berulang = muncul ≥ 2 kali di ≥ 2 percobaan berbeda. Ini prioritas untuk penjelasan mendalam.</p>';
  }
  h += "</div>";

  /* subtopics */
  var sub = {};
  A.forEach(function (a) { (a.items || []).forEach(function (it) { var k = a.mapel + "|" + a.bab + "|" + (it.sub || "(tanpa subtopik)"); var s = sub[k] = sub[k] || { n: 0, ok: 0 }; s.n++; if (it.benar) s.ok++; }); });
  var subs = Object.keys(sub).map(function (k) { var p = k.split("|"); return { mapel: p[0], bab: p[1], sub: p[2], n: sub[k].n, ok: sub[k].ok, p: pct(sub[k].ok, sub[k].n) }; }).sort(function (x, y) { return x.p - y.p; });
  h += '<div class="card"><h2>Per subtopik</h2><div class="scroll"><table class="tbl"><thead><tr><th>Subtopik</th><th class="num">Benar</th><th class="num">%</th><th>Status</th></tr></thead><tbody>';
  subs.forEach(function (s) { h += "<tr><td><b>" + esc(s.sub) + "</b><br><span class=\"note\">" + esc(s.mapel) + " · Bab " + esc(s.bab) + "</span></td><td class=\"num\">" + s.ok + "/" + s.n + "</td><td class=\"num\">" + s.p + "</td><td>" + (s.n < 4 ? '<span class="tag gray">Data sedikit</span>' : statusTag(s.p)) + "</td></tr>"; });
  h += "</tbody></table></div></div>";

  /* negation words */
  var ng = { n: 0, ok: 0 }, ot = { n: 0, ok: 0 };
  A.forEach(function (a) { (a.items || []).forEach(function (it) { var b = it.neg ? ng : ot; b.n++; if (it.benar) b.ok++; }); });
  if (ng.n) h += '<div class="card"><h2>Soal dengan kata TIDAK / BUKAN / KECUALI</h2><p class="note">Benar ' + ng.ok + "/" + ng.n + " (" + pct(ng.ok, ng.n) + "%), dibandingkan soal lain " + pct(ot.ok, ot.n) + "%." + (pct(ng.ok, ng.n) + 10 < pct(ot.ok, ot.n) ? " Selisihnya besar: latih kebiasaan melingkari kata TIDAK/BUKAN sebelum menjawab." : "") + "</p></div>";

  $("rBody").innerHTML = h + historyHtml(ATTEMPTS);
  bindPinOut();
}
function historyHtml(list) {
  var L = list.slice().sort(function (x, y) { return String(y.selesai).localeCompare(String(x.selesai)); });
  if (!L.length) return "";
  var h = '<div class="card"><h2>Riwayat percobaan</h2><div class="hist">';
  L.forEach(function (a, idx) {
    h += '<button class="hrow" type="button" data-i="' + idx + '"><span><b>' + esc(a.uji ? "Uji coba" : a.mapel + " Bab " + a.bab + " · Paket " + a.paket) + "</b><small>" + esc(fmtDate(a.selesai)) + " WITA · percobaan ke-" + esc(a.percobaanKe || "?") + " · " + Math.round((a.durasiDetik || 0) / 60) + " menit · " + esc(a.perangkat || "") + "</small></span><span class=\"sc\">" + esc(a.nilai) + "</span></button>";
    h += '<div class="detail" id="d' + idx + '" hidden></div>';
  });
  h += "</div></div>";
  setTimeout(function () {
    document.querySelectorAll(".hrow").forEach(function (b) {
      b.onclick = function () {
        var i = Number(b.getAttribute("data-i")), d = $("d" + i), a = L[i];
        if (!d.hidden) { d.hidden = true; return; }
        var wrong = (a.items || []).filter(function (it) { return !it.benar; });
        d.innerHTML = wrong.length ? wrong.map(function (it) {
          return '<div class="det"><b>No. ' + esc(it.no) + " (" + esc(it.tipe === "pg" ? "PG" : "isian") + ")</b> " + esc(it.q) + "<br>Jawaban anak: <b>" + esc(it.jawaban || "(kosong)") + "</b> · Kunci: <b>" + esc(it.kunci) + "</b>" + (it.mk ? '<br><span class="tag no">' + esc((a.mk && a.mk[it.mk]) || it.mk) + "</span>" : "") + (it.ubah ? " · diubah " + esc(it.ubah) + "×" : "") + "</div>";
        }).join("") : '<div class="det okd">Semua benar.</div>';
        d.hidden = false;
      };
    });
  }, 0);
  return h;
}

/* ===== Routing ===== */
function show(v) {
  $("vHome").hidden = v !== "home"; $("vQuiz").hidden = v !== "quiz"; $("vRekap").hidden = v !== "rekap"; $("qBar").hidden = v !== "quiz";
}
function route() {
  var h = location.hash || "";
  if (h.indexOf("#p/") === 0) { var id = decodeURIComponent(h.slice(3)); if (!Q || Q.p.id !== id || Q.submitted) openPaket(id); else show("quiz"); }
  else if (h === "#rekap") { show("rekap"); renderRekap(); if (db) loadAttempts(); window.scrollTo(0, 0); }
  else { Q = null; show("home"); renderHome(); if (db) loadAttempts(); window.scrollTo(0, 0); }
}
$("toRekap").addEventListener("click", function () { location.hash = "#rekap"; });
$("rBack").addEventListener("click", function () { location.hash = ""; });
window.addEventListener("hashchange", route);
refreshStatus();
loadPakets().then(function () { route(); connect(); });
if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(function () {});
</script>
